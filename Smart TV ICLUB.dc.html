<footer style="text-align:center; padding:40px 24px 70px; color:#A1A1A6; font-size:13px; letter-spacing:.02em; border-top:1px solid rgba(0,0,0,.06);">ICLUB · Smart TV</footer>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount(){ this._io=null; this._setup(); }
  componentWillUnmount(){ if(this._io) this._io.disconnect(); }
  renderVals(){ return {}; }
  _setup(){
    const cards=Array.prototype.slice.call(document.querySelectorAll('[data-cat-card]'));
    const reveal=(c)=>c.classList.add('in');
    if('IntersectionObserver' in window){
      this._io=new IntersectionObserver((ents)=>{ ents.forEach((e)=>{ if(e.isIntersecting){ reveal(e.target); this._io.unobserve(e.target); } }); },{threshold:0.12,rootMargin:'0px 0px -6% 0px'});
      cards.forEach((c,i)=>{ this._io.observe(c); const r=c.getBoundingClientRect(); if(r.top < (window.innerHeight||800)*0.96) setTimeout(()=>reveal(c),60+i*80); });
    } else { cards.forEach(reveal); }
    const g=window.gsap;
    cards.forEach((c)=>{
      const img=c.querySelector('[data-cc-img]'), arrow=c.querySelector('[data-cc-arrow]');
      c.addEventListener('mouseenter',()=>{ if(!g) return; g.to(c,{y:-8,duration:0.5,ease:'power2.out'}); if(img)g.to(img,{scale:1.045,duration:0.6,ease:'power2.out'}); if(arrow)g.to(arrow,{x:6,backgroundColor:'#EDE6DC',duration:0.45,ease:'power2.out'}); });
      c.addEventListener('mouseleave',()=>{ if(!g) return; g.to(c,{y:0,duration:0.55,ease:'power2.out'}); if(img)g.to(img,{scale:1,duration:0.6,ease:'power2.out'}); if(arrow)g.to(arrow,{x:0,backgroundColor:'#F5F1EC',duration:0.45,ease:'power2.out'}); });
    });
  }
}
</script>
